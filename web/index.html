<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>NoteSpin</title>
<link rel="stylesheet" href="css/app.css">
<script type="importmap">{"imports": {"three": "./js/vendor/three.module.js"}}</script>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="i-logo" viewBox="0 0 24 24"><path d="M7.6 4.2 3.3 6.6a1 1 0 0 0-.4 1.3l4.5 8.4" opacity=".55"/><path d="m16.4 4.2 4.3 2.4a1 1 0 0 1 .4 1.3l-4.5 8.4" opacity=".55"/><rect x="6.5" y="3" width="11" height="13" rx="1.8"/><path d="M6.5 6.6h11M9 10h6M9 12.8h4"/><circle cx="12" cy="19.4" r="2"/></symbol>
    <symbol id="i-collapse" viewBox="0 0 24 24"><path d="m14.5 6-6 6 6 6"/></symbol>
    <symbol id="i-expand" viewBox="0 0 24 24"><path d="m9.5 6 6 6-6 6"/></symbol>
    <symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
    <symbol id="i-search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m20 20-4.8-4.8"/></symbol>
    <symbol id="i-up" viewBox="0 0 24 24"><path d="m6 15 6-6 6 6"/></symbol>
    <symbol id="i-down" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></symbol>
    <symbol id="i-sound" viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18.5 5.5a9 9 0 0 1 0 13"/></symbol>
    <symbol id="i-mute" viewBox="0 0 24 24"><path d="M11 5 6 9H3v6h3l5 4z"/><path d="m16 9 5 6M21 9l-5 6"/></symbol>
    <symbol id="i-reset" viewBox="0 0 24 24"><path d="M4 12a8 8 0 1 0 2.6-5.9"/><path d="M4 4.5V9h4.5"/></symbol>
    <symbol id="i-settings" viewBox="0 0 24 24"><path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2.2"/><circle cx="9" cy="17" r="2.2"/></symbol>
    <symbol id="i-tag" viewBox="0 0 24 24"><path d="M3.5 12.2V4.5a1 1 0 0 1 1-1h7.7l8.3 8.3a1 1 0 0 1 0 1.4l-7.4 7.4a1 1 0 0 1-1.4 0z"/><circle cx="8" cy="8" r="1.4"/></symbol>
    <symbol id="i-book" viewBox="0 0 24 24"><path d="M5 4.5A1.5 1.5 0 0 1 6.5 3H19v15H6.5A1.5 1.5 0 0 0 5 19.5z"/><path d="M5 19.5A1.5 1.5 0 0 0 6.5 21H19v-3"/></symbol>
    <symbol id="i-caret" viewBox="0 0 24 24"><path d="m7 10 5 5 5-5"/></symbol>
    <symbol id="i-back" viewBox="0 0 24 24"><path d="m14 6-6 6 6 6"/></symbol>
    <symbol id="i-lock" viewBox="0 0 24 24"><rect x="5" y="10.5" width="14" height="10" rx="2"/><path d="M8 10.5V8a4 4 0 0 1 8 0v2.5"/></symbol>
    <symbol id="i-trash" viewBox="0 0 24 24"><path d="M4 7h16M10 3.5h4M6.5 7l1 13h9l1-13M10 11v6M14 11v6"/></symbol>
    <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
    <symbol id="i-ul" viewBox="0 0 24 24"><circle cx="5" cy="7" r="1.3" fill="currentColor"/><circle cx="5" cy="12" r="1.3" fill="currentColor"/><circle cx="5" cy="17" r="1.3" fill="currentColor"/><path d="M9.5 7H20M9.5 12H20M9.5 17H20"/></symbol>
    <symbol id="i-ol" viewBox="0 0 24 24"><path d="M3.8 5.2 5 4.5v5M3.8 9.5h2.4M3.6 14.6a1.3 1.3 0 1 1 2.2 1L3.6 19h2.7M10 7h10M10 12h10M10 17h10"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><rect x="3" y="4" width="6" height="6" rx="1.2"/><path d="m4.4 7.1 1.3 1.3L8.2 5.6"/><rect x="3" y="14" width="6" height="6" rx="1.2"/><path d="M12 7h8M12 17h8"/></symbol>
    <symbol id="i-indent" viewBox="0 0 24 24"><path d="M10 6h10M10 12h10M10 18h10M3.5 9l3 3-3 3"/></symbol>
    <symbol id="i-outdent" viewBox="0 0 24 24"><path d="M10 6h10M10 12h10M10 18h10M6.5 9l-3 3 3 3"/></symbol>
  </defs>
</svg>

<aside id="panel" aria-label="NoteSpin controls">
  <div class="brand">
    <svg class="logo"><use href="#i-logo"/></svg>
    <span class="wide">NoteSpin</span>
    <button id="collapseBtn" class="icon-btn" title="Hide the panel" aria-label="Hide the panel"><svg><use href="#i-collapse"/></svg></button>
  </div>

  <button id="nbBtn" class="nb-btn" title="Notebooks, backups" aria-haspopup="menu">
    <svg><use href="#i-book"/></svg>
    <span class="wide nb-text"><span class="nb-label">Notebook</span><span id="nbName" class="nb-name">…</span></span>
    <svg class="wide caret"><use href="#i-caret"/></svg>
  </button>

  <button id="newBtn" class="primary-btn" title="New note (Ctrl+N)">
    <svg><use href="#i-plus"/></svg><span class="wide">New note</span><kbd class="wide">Ctrl+N</kbd>
  </button>

  <div class="search" id="searchBox">
    <svg><use href="#i-search"/></svg>
    <input id="searchInput" class="wide" type="search" placeholder="Search notes" spellcheck="false" autocomplete="off" aria-label="Search notes (Ctrl+F)">
    <button id="searchClear" class="icon-btn small wide" title="Clear search (Esc)" aria-label="Clear search" hidden><svg><use href="#i-x"/></svg></button>
  </div>
  <div id="searchInfo" class="info wide"></div>

  <div class="group wide">
    <div class="label">Show</div>
    <div class="seg" id="viewSeg" role="radiogroup" aria-label="Show">
      <button data-view="all" role="radio">All notes</button>
      <button data-view="categories" role="radio">Categories</button>
    </div>
  </div>
  <div class="group wide">
    <div class="label">Order</div>
    <div class="seg" id="orderSeg" role="radiogroup" aria-label="Order">
      <button data-order="az" role="radio" title="By title, A to Z">A–Z</button>
      <button data-order="recent" role="radio" title="Most recently edited first">Recent</button>
    </div>
  </div>

  <div id="crumb" class="crumb" hidden>
    <button id="crumbBack" class="crumb-back" title="Back to all categories (Backspace)"><svg><use href="#i-back"/></svg><span class="wide">Categories</span></button>
    <span class="crumb-cat wide"><span id="crumbDot" class="dot"></span><span id="crumbName"></span></span>
  </div>

  <div class="nav">
    <button id="prevBtn" class="nav-btn" title="Previous card (↑)"><svg><use href="#i-up"/></svg><span class="wide">Previous</span></button>
    <button id="nextBtn" class="nav-btn" title="Next card (↓)"><svg><use href="#i-down"/></svg><span class="wide">Next</span></button>
  </div>
  <div id="posInfo" class="info center wide"></div>

  <div class="spacer"></div>

  <div class="foot">
    <button id="catsBtn" class="icon-btn" title="Categories and colours" aria-label="Categories and colours"><svg><use href="#i-tag"/></svg></button>
    <button id="soundBtn" class="icon-btn" title="Sound" aria-label="Sound"><svg><use href="#i-sound"/></svg></button>
    <button id="viewBtn" class="icon-btn" title="Straighten the view" aria-label="Straighten the view"><svg><use href="#i-reset"/></svg></button>
    <button id="settingsBtn" class="icon-btn" title="Settings" aria-label="Settings"><svg><use href="#i-settings"/></svg></button>
  </div>
</aside>

<main id="stage" aria-label="Note cards">
  <div id="empty" class="stage-empty" hidden>
    <p id="emptyText"></p>
    <button id="emptyBtn" class="primary-btn inline"></button>
  </div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
</main>

<div id="editorLayer" class="ed-layer" hidden>
  <div class="ed-card" role="dialog" aria-label="Note">
    <header class="ed-band">
      <div class="ed-cat">
        <svg><use href="#i-tag"/></svg>
        <input id="edCat" type="text" maxlength="60" placeholder="General" autocomplete="off" spellcheck="false" aria-label="Category (blank for General)">
        <div id="edCatList" class="ed-catlist" hidden></div>
      </div>
      <span id="edStatus" class="ed-status"></span>
      <button id="edLock" class="ed-btn" title="Lock with a password" aria-label="Lock"><svg><use href="#i-lock"/></svg></button>
      <button id="edDelete" class="ed-btn" title="Delete note" aria-label="Delete note"><svg><use href="#i-trash"/></svg></button>
      <button id="edClose" class="ed-btn" title="Close (Esc)" aria-label="Close"><svg><use href="#i-x"/></svg></button>
    </header>
    <div class="ed-tools">
      <button data-cmd="ul" title="Bulleted list (type - and a space)" aria-label="Bulleted list"><svg><use href="#i-ul"/></svg></button>
      <button data-cmd="ol" title="Numbered list (type 1. and a space)" aria-label="Numbered list"><svg><use href="#i-ol"/></svg></button>
      <button data-cmd="check" title="Checklist (type [] and a space; Ctrl+Enter ticks)" aria-label="Checklist"><svg><use href="#i-check"/></svg></button>
      <span class="ed-sep"></span>
      <button data-cmd="outdent" title="Move a list item out a level (Shift+Tab)" aria-label="Move list item out"><svg><use href="#i-outdent"/></svg></button>
      <button data-cmd="indent" title="Move a list item in, under the one above (Tab)" aria-label="Move list item in"><svg><use href="#i-indent"/></svg></button>
      <span id="edLockInfo" class="ed-lockinfo" hidden><svg><use href="#i-lock"/></svg>Locked: the first line and the category stay readable</span>
    </div>
    <div class="ed-scroll">
      <div id="edBody" class="ed-body" contenteditable="true" spellcheck="true" aria-label="Note text" aria-multiline="true"></div>
    </div>
    <footer class="ed-foot"><span id="edMeta"></span></footer>
  </div>
</div>

<div id="dialogs"></div>

<script src="js/host.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
