<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>NoteSpin</title>
<link rel="stylesheet" href="css/app.css">
<script type="importmap">{"imports": {"three": "./js/vendor/three.module.js"}}</script>
</head>
<body>
<script src="js/icons.js"></script>

<aside id="panel" aria-label="NoteSpin controls">
  <div class="brand">
    <svg class="logo"><use href="#i-logo"/></svg>
    <span class="wide">NoteSpin</span>
    <button id="collapseBtn" class="icon-btn" title="Hide the panel" aria-label="Hide the panel"><svg><use href="#i-collapse"/></svg></button>
  </div>

  <button id="nbBtn" class="nb-btn" title="Notebooks, backups" aria-haspopup="menu">
    <svg><use href="#i-book"/></svg>
    <span class="wide nb-text"><span class="nb-label">Notebook</span><span id="nbName" class="nb-name">…</span></span>
    <svg class="wide caret"><use href="#i-caret"/></svg>
  </button>

  <button id="newBtn" class="primary-btn" title="New note (Ctrl+N)">
    <svg><use href="#i-plus"/></svg><span class="wide">New note</span><kbd class="wide">Ctrl+N</kbd>
  </button>

  <div class="search" id="searchBox">
    <svg><use href="#i-search"/></svg>
    <input id="searchInput" class="wide" type="search" placeholder="Search notes" spellcheck="false" autocomplete="off" aria-label="Search notes (Ctrl+F)">
    <button id="searchClear" class="icon-btn small wide" title="Clear search (Esc)" aria-label="Clear search" hidden><svg><use href="#i-x"/></svg></button>
  </div>
  <div id="searchInfo" class="info wide"></div>

  <!-- the panel folded: one button for All notes / Categories (its icon shows which is on) -->
  <button id="viewToggle" class="nav-btn folded-only" type="button"><svg><use href="#i-cards"/></svg></button>

  <div class="group wide">
    <div class="label">Show</div>
    <div class="seg" id="viewSeg" role="radiogroup" aria-label="Show">
      <button data-view="all" role="radio">All notes</button>
      <button data-view="categories" role="radio">Categories</button>
    </div>
  </div>
  <div class="group wide">
    <div class="label">Order</div>
    <div class="seg" id="orderSeg" role="radiogroup" aria-label="Order">
      <button data-order="az" role="radio" title="By title, A to Z">A–Z</button>
      <button data-order="recent" role="radio" title="Most recently edited first">Recent</button>
    </div>
  </div>

  <div id="crumb" class="crumb" hidden>
    <button id="crumbBack" class="crumb-back" title="Back to all categories (Backspace)"><svg><use href="#i-back"/></svg><span class="wide">Categories</span></button>
    <span class="crumb-cat wide"><span id="crumbDot" class="dot"></span><span id="crumbName"></span></span>
  </div>

  <div class="nav">
    <button id="prevBtn" class="nav-btn" title="Previous card (↑)"><svg><use href="#i-up"/></svg><span class="wide">Previous</span></button>
    <button id="nextBtn" class="nav-btn" title="Next card (↓)"><svg><use href="#i-down"/></svg><span class="wide">Next</span></button>
  </div>
  <div id="posInfo" class="info center wide"></div>

  <div class="spacer"></div>

  <div class="foot">
    <button id="catsBtn" class="icon-btn" title="Categories and colours" aria-label="Categories and colours"><svg><use href="#i-tag"/></svg></button>
    <button id="soundBtn" class="icon-btn" title="Sound" aria-label="Sound"><svg><use href="#i-sound"/></svg></button>
    <button id="viewBtn" class="icon-btn" title="Straighten the view" aria-label="Straighten the view"><svg><use href="#i-reset"/></svg></button>
    <button id="settingsBtn" class="icon-btn" title="Settings" aria-label="Settings"><svg><use href="#i-settings"/></svg></button>
  </div>
</aside>

<main id="stage" aria-label="Note cards">
  <div id="empty" class="stage-empty" hidden>
    <p id="emptyText"></p>
    <button id="emptyBtn" class="primary-btn inline"></button>
  </div>
  <div id="toasts" class="toasts" aria-live="polite"></div>
</main>

<!-- where a note window can be dropped to put its note back (over an open note too) -->
<div id="dropZone" class="drop-zone" hidden><span>Drop here to put the note back</span></div>

<!-- the note editor (web\js\editor.js) goes here -->
<div id="dialogs"></div>

<script src="js/host.js"></script>
<script type="module" src="js/app.js"></script>
</body>
</html>
